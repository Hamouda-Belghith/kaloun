workflows:
  ios-testflight:
    name: Mosshaf Qaloun - iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: app
    environment:
      groups:
        # À créer dans Codemagic (Teams > Environment variables), groupe "app_store_credentials" :
        # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY
        - app_store_credentials
      vars:
        # Généré par `flutter create` (org com.hamoudabelghith). À changer ici + dans
        # Xcode/ios/Runner.xcodeproj si le nom définitif de l'app change (.ia/PLAN.md).
        BUNDLE_ID: "com.hamoudabelghith.mosshafQaloun"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          app-store-connect list-builds
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter packages pull
      - name: Install pods
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
