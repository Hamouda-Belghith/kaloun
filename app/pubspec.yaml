name: mosshaf_qaloun
description: "Mosshaf Qaloun — Édition Tunisienne : lecture du Coran hors-ligne avec navigation par page, sourate et Juz'."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/navigation.json
    - assets/pages/
